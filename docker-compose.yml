services:
  spark-master:
    build: .
    image: spark-distributed-ml:latest
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - .:/opt/spark/work-dir
    networks:
      - spark-net

  spark-worker-1:
    image: spark-distributed-ml:latest
    container_name: spark-worker-1
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    ports:
      - "8081:8081"
    volumes:
      - .:/opt/spark/work-dir
    networks:
      - spark-net

  spark-worker-2:
    image: spark-distributed-ml:latest
    container_name: spark-worker-2
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8082
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    ports:
      - "8082:8082"
    volumes:
      - .:/opt/spark/work-dir
    networks:
      - spark-net

  spark-worker-3:
    image: spark-distributed-ml:latest
    container_name: spark-worker-3
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8083
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    ports:
      - "8083:8083"
    volumes:
      - .:/opt/spark/work-dir
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge
